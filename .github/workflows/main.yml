name: RDP com Tailscale

on: 
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Configurar RDP e Firewall
      shell: powershell
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force
        
        netsh advfirewall firewall delete rule name="RDP-Tailscale" 2>$null
        netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389
        
        Restart-Service -Name TermService -Force

    - name: Instalar Tailscale
      shell: powershell
      run: |
        winget install --id Tailscale.Tailscale --silent --accept-source-agreements --accept-package-agreements

    - name: Iniciar Servidor RDP e Tailscale
      shell: powershell
      run: |
        # 1. Gerar Senha Segura
        Add-Type -AssemblyName System.Security
        $chars = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%^&*"
        $password = -join ((1..16) | ForEach-Object { $chars[(Get-Random -Maximum $chars.Length)] })
        $securePass = ConvertTo-SecureString $password -AsPlainText -Force
        
        # 2. Criar Usuário
        New-LocalUser -Name "RdpUser" -Password $securePass -Description "Usuario RDP" -ErrorAction SilentlyContinue
        Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RdpUser" -ErrorAction SilentlyContinue
        Add-LocalGroupMember -Group "Administrators" -Member "RdpUser" -ErrorAction SilentlyContinue

        # 3. Conectar ao Tailscale
        $env:Path += ";C:\Program Files\Tailscale"
        tailscale up --authkey="${{ secrets.TAILSCALE_AUTH_KEY }}" --unattended --accept-routes
        
        # Aguarda 3 segundos para garantir a atribuição de IP
        Start-Sleep -Seconds 3
        $tailscaleIp = tailscale ip -4

        # 4. Exibir Dados de Conexão no Log
        Write-Host "==========================================" -ForegroundColor Green
        Write-Host ">>> CONEXÃO PRONTA <<<" -ForegroundColor Green
        Write-Host "IP TAILSCALE : $tailscaleIp" -ForegroundColor Yellow
        Write-Host "USUARIO      : RdpUser" -ForegroundColor Yellow
        Write-Host "SENHA        : $password" -ForegroundColor Yellow
        Write-Host "==========================================" -ForegroundColor Green
        Write-Host "Conecte-se usando o aplicativo de Conexao de Area de Trabalho Remota."
        
        # 5. Manter a máquina ativa
        while ($true) {
            Start-Sleep -Seconds 60
        }
