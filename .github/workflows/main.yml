name: RDP com Tailscale

on: 
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Otimizar Recursos, Threads e Configurar RDP
      shell: powershell
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force
        netsh advfirewall firewall delete rule name="RDP-Tailscale" 2>$null
        netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389

        reg add "HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services" /v fEnableDesktopWallpaper /t REG_DWORD /d 1 /f
        reg add "HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services" /v MaxColorDepth /t REG_DWORD /d 32 /f

        powercfg /setactive 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c
        powercfg /setacvalueindex scheme_current sub_processor CPMINCORES 100
        powercfg /setacvalueindex scheme_current sub_processor CPMAXCORES 100
        powercfg /setacvalueindex scheme_current sub_processor THROTTLING 0
        powercfg /setacvalueindex scheme_current sub_processor PERFBOOSTMODE 2
        powercfg /setactive scheme_current

        Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\PriorityControl" -Name "Win32PrioritySeparation" -Value 38 -Force
        Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Memory Management" -Name "LargeSystemCache" -Value 0 -Force
        Set-CimInstance -Query "SELECT * FROM Win32_PageFileSetting WHERE SettingID LIKE 'C:%'" -Property @{InitialSize = 8192; MaximumSize = 16384} -ErrorAction SilentlyContinue

        Restart-Service -Name TermService -Force

    - name: Baixar e Substituir Temas do Windows 11
      shell: powershell
      run: |
        $ErrorActionPreference = "SilentlyContinue"
        $wallpaperDir = "C:\Wallpapers"
        New-Item -ItemType Directory -Force -Path $wallpaperDir
        $pngPath = "$wallpaperDir\wallpaper.png"
        $bmpPath = "$wallpaperDir\wallpaper.bmp"
        $jpgPath = "$wallpaperDir\wallpaper.jpg"

        $url = "https://raw.githubusercontent.com/davimikeben/WALLPAPER-IMAGEM-PARA-PC/refs/heads/main/file_000000009e10820eb6fa2a09146bf436.png"
        Invoke-WebRequest -Uri $url -OutFile $pngPath

        Add-Type -AssemblyName System.Drawing
        $image = [System.Drawing.Image]::FromFile($pngPath)
        $image.Save($bmpPath, [System.Drawing.Imaging.ImageFormat]::Bmp)
        $image.Save($jpgPath, [System.Drawing.Imaging.ImageFormat]::Jpeg)
        $image.Dispose()

        $targets = @(
            "C:\Windows\Web\Wallpaper\Windows\img0.jpg",
            "C:\Windows\Web\Wallpaper\Theme1\img1.jpg",
            "C:\Windows\Web\Wallpaper\Theme2\img2.jpg",
            "C:\Windows\Web\4K\Wallpaper\Windows\img0_3840x2160.jpg",
            "C:\Windows\Web\4K\Wallpaper\Windows\img0_1920x1200.jpg"
        )

        foreach ($target in $targets) {
            if (Test-Path $target) {
                cmd /c "takeown /f `"$target`" /a >nul 2>&1"
                cmd /c "icacls `"$target`" /grant Administrators:F >nul 2>&1"
                Copy-Item -Path $jpgPath -Destination $target -Force -ErrorAction SilentlyContinue
            }
        }

        reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\PersonalizationCSP" /v DesktopImagePath /t REG_SZ /d "$jpgPath" /f
        reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\PersonalizationCSP" /v DesktopImageUrl /t REG_SZ /d "$jpgPath" /f
        reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\PersonalizationCSP" /v DesktopImageStatus /t REG_DWORD /d 1 /f

        reg add "HKLM\SOFTWARE\Policies\Microsoft\Windows\Personalization" /v LockScreenImage /t REG_SZ /d "$jpgPath" /f
        exit 0

    - name: Criar Script de Aplicacao Automatica no Login
      shell: powershell
      run: |
        $startupDir = "C:\ProgramData\Microsoft\Windows\Start Menu\Programs\Startup"
        
        $vbs = @"
        Set oShell = CreateObject("WScript.Shell")
        Set fso = CreateObject("Scripting.FileSystemObject")
        WScript.Sleep 2000
        oShell.RegWrite "HKCU\Control Panel\Desktop\Wallpaper", "C:\Wallpapers\wallpaper.bmp", "REG_SZ"
        oShell.RegWrite "HKCU\Control Panel\Desktop\WallpaperStyle", "2", "REG_SZ"
        oShell.Run "RUNDLL32.EXE user32.dll,UpdatePerUserSystemParameters 1, True", 0, True
        "@
        
        Set-Content -Path "$startupDir\set_wallpaper.vbs" -Value $vbs -Encoding Ascii

    - name: Instalar Ferramentas e Tailscale
      shell: powershell
      run: |
        $ErrorActionPreference = "Continue"
        winget install --id Tailscale.Tailscale --silent --accept-source-agreements --accept-package-agreements
        winget install --id Google.Chrome --silent --accept-source-agreements --accept-package-agreements
        exit 0

    - name: Iniciar Servidor RDP e Tailscale
      shell: powershell
      run: |
        Add-Type -AssemblyName System.Security
        $chars = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%^&*"
        $password = -join ((1..16) | ForEach-Object { $chars[(Get-Random -Maximum $chars.Length)] })
        $securePass = ConvertTo-SecureString $password -AsPlainText -Force
        
        New-LocalUser -Name "RdpUser" -Password $securePass -Description "Usuario RDP" -ErrorAction SilentlyContinue
        Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RdpUser" -ErrorAction SilentlyContinue
        Add-LocalGroupMember -Group "Administrators" -Member "RdpUser" -ErrorAction SilentlyContinue

        $env:Path += ";C:\Program Files\Tailscale"
        tailscale up --authkey="${{ secrets.TAILSCALE_AUTH_KEY }}" --unattended --accept-routes
        
        Start-Sleep -Seconds 3
        $tailscaleIp = tailscale ip -4

        Write-Host "==========================================" -ForegroundColor Green
        Write-Host ">>> CONEXÃO PRONTA <<<" -ForegroundColor Green
        Write-Host "IP TAILSCALE : $tailscaleIp" -ForegroundColor Yellow
        Write-Host "USUARIO      : RdpUser" -ForegroundColor Yellow
        Write-Host "SENHA        : $password" -ForegroundColor Yellow
        Write-Host "==========================================" -ForegroundColor Green
        
        while ($true) {
            Start-Sleep -Seconds 60
        }
