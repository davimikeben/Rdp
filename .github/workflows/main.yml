name: Ubuntu RDP com Tailscale

on: 
  workflow_dispatch:

jobs:
  ubuntu-rdp:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
    - name: Atualizar Sistema e Instalar Interface Leve (XFCE) e XRDP
      run: |
        sudo apt update -y
        sudo DEBIAN_FRONTEND=noninteractive apt install -y xfce4 xfce4-goodies xrdp feh dbus-x11

        # Configura o XRDP para abrir o ambiente XFCE
        echo "xfce4-session" > ~/.xsession
        sudo cp ~/.xsession /etc/skel/.xsession
        sudo adduser xrdp ssl-cert

        # Otimizacoes de buffer e performance de rede do Linux
        sudo sysctl -w net.core.rmem_max=16777216
        sudo sysctl -w net.core.wmem_max=16777216
        sudo sysctl -w net.ipv4.tcp_rmem="4096 87380 16777216"
        sudo sysctl -w net.ipv4.tcp_wmem="4096 65536 16777216"

        sudo systemctl restart xrdp

    - name: Instalar Google Chrome e Ferramentas
      run: |
        wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
        sudo apt install -y ./google-chrome-stable_current_amd64.deb
        rm -f google-chrome-stable_current_amd64.deb

    - name: Baixar e Configurar Wallpaper
      run: |
        mkdir -p ~/Pictures
        wget -q -O ~/Pictures/wallpaper.png "https://raw.githubusercontent.com/davimikeben/WALLPAPER-IMAGEM-PARA-PC/refs/heads/main/file_000000009e10820eb6fa2a09146bf436.png"

        # Script de inicializacao automatica para aplicar o wallpaper na sessao grafica
        mkdir -p ~/.config/autostart
        cat << 'EOF' > ~/.config/autostart/wallpaper.desktop
        [Desktop Entry]
        Type=Application
        Exec=feh --bg-scale ~/Pictures/wallpaper.png
        Hidden=false
        NoDisplay=false
        X-GNOME-Autostart-enabled=true
        Name=SetWallpaper
        EOF

        # Copia para novos usuarios
        sudo mkdir -p /etc/skel/.config/autostart
        sudo cp ~/.config/autostart/wallpaper.desktop /etc/skel/.config/autostart/

    - name: Instalar e Conectar Tailscale
      run: |
        curl -fsSL https://tailscale.com/install.sh | sh
        sudo tailscale up --authkey="${{ secrets.TAILSCALE_AUTH_KEY }}" --unattended --accept-routes
        
        sleep 3
        TS_IP=$(tailscale ip -4)
        echo "TS_IP=$TS_IP" >> $GITHUB_ENV

    - name: Criar Usuario e Exibir Dados de Conexao
      run: |
        # Gera uma senha aleatoria de 16 caracteres
        PASSWORD=$(tr -dc 'A-Za-z0-9!@#$%^&*' < /dev/urandom | head -c 16)
        
        # Cria o usuario RdpUser com privilegios sudo
        sudo useradd -m -s /bin/bash RdpUser
        echo "RdpUser:$PASSWORD" | sudo chpasswd
        sudo usermod -aG sudo RdpUser
        sudo usermod -aG ssl-cert RdpUser

        # Copia os arquivos de sessao e wallpaper para a home do RdpUser
        sudo cp -r ~/Pictures /home/RdpUser/
        sudo cp -r ~/.config /home/RdpUser/
        sudo cp ~/.xsession /home/RdpUser/
        sudo chown -R RdpUser:RdpUser /home/RdpUser/

        echo "=========================================="
        echo ">>> UBUNTU RDP PRONTO <<<"
        echo "IP TAILSCALE : $TS_IP"
        echo "USUARIO      : RdpUser"
        echo "SENHA        : $PASSWORD"
        echo "=========================================="
        echo "Conecte-se usando o seu aplicativo de RDP normalmente."

        # Mantem a maquina ativa pelo limite maximo de tempo
        while true; do
            sleep 60
        done
