name: RDP e StarDesk com Tailscale

on: 
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Configurar Recursos, Audio, Firewall e RDP
      shell: powershell
      run: |
        $ErrorActionPreference = "SilentlyContinue"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "fDisableAudio" -Value 0 -Force

        Set-Service -Name "Audiosrv" -StartupType Automatic
        Start-Service -Name "Audiosrv" -Force
        Set-Service -Name "AudioEndpointBuilder" -StartupType Automatic
        Start-Service -Name "AudioEndpointBuilder" -Force

        reg add "HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services" /v fEnableDesktopWallpaper /t REG_DWORD /d 1 /f
        reg add "HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services" /v MaxColorDepth /t REG_DWORD /d 32 /f

        netsh advfirewall set allprofiles state off
        netsh int tcp set global autotuninglevel=disabled

        New-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile" -Name "NetworkThrottlingIndex" -Value 0xffffffff -PropertyType DWord -Force
        New-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile" -Name "SystemResponsiveness" -Value 0 -PropertyType DWord -Force
        reg add "HKLM\SOFTWARE\Policies\Microsoft\Windows\Psched" /v NonBestEffortLimit /t REG_DWORD /d 0 /f

        powercfg /setactive 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c
        Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\PriorityControl" -Name "Win32PrioritySeparation" -Value 38 -Force
        Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Memory Management" -Name "LargeSystemCache" -Value 0 -Force
        Set-CimInstance -Query "SELECT * FROM Win32_PageFileSetting WHERE SettingID LIKE 'C:%'" -Property @{InitialSize = 8192; MaximumSize = 16384}

        Restart-Service -Name TermService -Force

    - name: Processar e Aplicar Wallpaper
      shell: powershell
      run: |
        $ErrorActionPreference = "SilentlyContinue"
        $wallpaperDir = "C:\Wallpapers"
        New-Item -ItemType Directory -Force -Path $wallpaperDir
        $pngPath = "$wallpaperDir\wallpaper.png"
        $bmpPath = "$wallpaperDir\wallpaper.bmp"
        $jpgPath = "$wallpaperDir\wallpaper.jpg"

        $url = "https://raw.githubusercontent.com/davimikeben/WALLPAPER-IMAGEM-PARA-PC/refs/heads/main/thumb-1920-1399041.jpg"
        Invoke-WebRequest -Uri $url -OutFile $pngPath

        Add-Type -AssemblyName System.Drawing
        $image = [System.Drawing.Image]::FromFile($pngPath)
        $image.Save($bmpPath, [System.Drawing.Imaging.ImageFormat]::Bmp)
        $image.Save($jpgPath, [System.Drawing.Imaging.ImageFormat]::Jpeg)
        $image.Dispose()

        reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System" /v Wallpaper /t REG_SZ /d "$bmpPath" /f
        reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System" /v WallpaperStyle /t REG_SZ /d "2" /f

        reg load HKU\DefaultTemp "C:\Users\Default\NTUSER.DAT"
        reg add "HKU\DefaultTemp\Control Panel\Desktop" /v Wallpaper /t REG_SZ /d "$bmpPath" /f
        reg add "HKU\DefaultTemp\Control Panel\Desktop" /v WallpaperStyle /t REG_SZ /d "2" /f
        [GC]::Collect()
        reg unload HKU\DefaultTemp

        $targets = @(
            "C:\Windows\Web\Wallpaper\Windows\img0.jpg",
            "C:\Windows\Web\4K\Wallpaper\Windows\img0_3840x2160.jpg"
        )
        foreach ($t in $targets) {
            if (Test-Path $t) {
                cmd /c "takeown /f `"$t`" /a >nul 2>&1"
                cmd /c "icacls `"$t`" /grant Administrators:F >nul 2>&1"
                Copy-Item -Path $jpgPath -Destination $t -Force
            }
        }

    - name: Instalar Programas e Baixar StarDesk
      shell: powershell
      run: |
        $ErrorActionPreference = "Continue"
        winget install --id Tailscale.Tailscale --silent --accept-source-agreements --accept-package-agreements
        winget install --id Google.Chrome --silent --accept-source-agreements --accept-package-agreements
        winget install --id VB-Audio.VirtualCable --silent --accept-source-agreements --accept-package-agreements
        winget install --id Stardesk.Stardesk -e --silent --accept-source-agreements --accept-package-agreements

        $stardeskInstaller = "C:\Users\Public\Desktop\Instalar_StarDesk.exe"
        Invoke-WebRequest -Uri "https://www.stardesk.net/api/v1/release/dl/1" -OutFile $stardeskInstaller -UserAgent "Mozilla/5.0" -ErrorAction SilentlyContinue
        exit 0

    - name: Iniciar Servicos e Finalizar
      shell: powershell
      run: |
        Add-Type -AssemblyName System.Security
        $chars = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%^&*"
        $password = -join ((1..16) | ForEach-Object { $chars[(Get-Random -Maximum $chars.Length)] })
        $securePass = ConvertTo-SecureString $password -AsPlainText -Force
        
        New-LocalUser -Name "RdpUser" -Password $securePass -Description "Usuario RDP" -ErrorAction SilentlyContinue
        Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RdpUser" -ErrorAction SilentlyContinue
        Add-LocalGroupMember -Group "Administrators" -Member "RdpUser" -ErrorAction SilentlyContinue

        $env:Path += ";C:\Program Files\Tailscale"
        tailscale up --authkey="${{ secrets.TAILSCALE_AUTH_KEY }}" --unattended --accept-routes
        
        Start-Sleep -Seconds 3
        $tailscaleIp = tailscale ip -4

        Write-Host "==========================================" -ForegroundColor Green
        Write-Host "DADOS DE CONEXAO" -ForegroundColor Green
        Write-Host "IP TAILSCALE   : $tailscaleIp" -ForegroundColor Yellow
        Write-Host "USUARIO        : RdpUser" -ForegroundColor Yellow
        Write-Host "SENHA          : $password" -ForegroundColor Yellow
        Write-Host "------------------------------------------" -ForegroundColor Cyan
        Write-Host "STARDESK       : Instalado / Disponivel na Area de Trabalho" -ForegroundColor Cyan
        Write-Host "==========================================" -ForegroundColor Green

        while ($true) {
            Start-Sleep -Seconds 60
        }
