name: RDP e Sunshine com Diagnostico

on: 
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Otimizar Recursos e Configurar RDP
      shell: powershell
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force
        netsh advfirewall firewall delete rule name="RDP-Tailscale" 2>$null
        netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389

        reg add "HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services" /v fEnableDesktopWallpaper /t REG_DWORD /d 1 /f
        reg add "HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services" /v MaxColorDepth /t REG_DWORD /d 32 /f

        powercfg /setactive 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c
        Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\PriorityControl" -Name "Win32PrioritySeparation" -Value 38 -Force
        Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Memory Management" -Name "LargeSystemCache" -Value 0 -Force
        Set-CimInstance -Query "SELECT * FROM Win32_PageFileSetting WHERE SettingID LIKE 'C:%'" -Property @{InitialSize = 8192; MaximumSize = 16384} -ErrorAction SilentlyContinue

        Restart-Service -Name TermService -Force

    - name: Baixar e Processar Imagem
      shell: powershell
      run: |
        $wallpaperDir = "C:\Wallpapers"
        New-Item -ItemType Directory -Force -Path $wallpaperDir
        $pngPath = "$wallpaperDir\wallpaper.png"
        $bmpPath = "$wallpaperDir\wallpaper.bmp"
        $jpgPath = "$wallpaperDir\wallpaper.jpg"

        $url = "https://raw.githubusercontent.com/davimikeben/WALLPAPER-IMAGEM-PARA-PC/refs/heads/main/file_000000009e10820eb6fa2a09146bf436.png"
        Invoke-WebRequest -Uri $url -OutFile $pngPath

        Add-Type -AssemblyName System.Drawing
        $image = [System.Drawing.Image]::FromFile($pngPath)
        $image.Save($bmpPath, [System.Drawing.Imaging.ImageFormat]::Bmp)
        $image.Save($jpgPath, [System.Drawing.Imaging.ImageFormat]::Jpeg)
        $image.Dispose()

        reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System" /v Wallpaper /t REG_SZ /d "$bmpPath" /f
        reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System" /v WallpaperStyle /t REG_SZ /d "2" /f

        reg load HKU\DefaultTemp "C:\Users\Default\NTUSER.DAT"
        reg add "HKU\DefaultTemp\Control Panel\Desktop" /v Wallpaper /t REG_SZ /d "$bmpPath" /f
        reg add "HKU\DefaultTemp\Control Panel\Desktop" /v WallpaperStyle /t REG_SZ /d "2" /f
        [GC]::Collect()
        reg unload HKU\DefaultTemp

        takeown /f "C:\Windows\Web\Wallpaper\Windows\img0.jpg" /a 2>$null
        icacls "C:\Windows\Web\Wallpaper\Windows\img0.jpg" /grant "Administrators:(F)" 2>$null
        Copy-Item -Path $jpgPath -Destination "C:\Windows\Web\Wallpaper\Windows\img0.jpg" -Force

    - name: Instalar Ferramentas, Tailscale e Sunshine
      shell: powershell
      run: |
        $ErrorActionPreference = "Continue"
        winget install --id Tailscale.Tailscale --silent --accept-source-agreements --accept-package-agreements
        winget install --id Google.Chrome --silent --accept-source-agreements --accept-package-agreements
        winget install --id LizardByte.Sunshine --silent --accept-source-agreements --accept-package-agreements
        exit 0

    - name: Iniciar Servicos e Diagnostico Detalhado
      shell: powershell
      run: |
        Add-Type -AssemblyName System.Security
        $chars = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%^&*"
        $password = -join ((1..16) | ForEach-Object { $chars[(Get-Random -Maximum $chars.Length)] })
        $securePass = ConvertTo-SecureString $password -AsPlainText -Force
        
        New-LocalUser -Name "RdpUser" -Password $securePass -Description "Usuario RDP" -ErrorAction SilentlyContinue
        Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RdpUser" -ErrorAction SilentlyContinue
        Add-LocalGroupMember -Group "Administrators" -Member "RdpUser" -ErrorAction SilentlyContinue

        $env:Path += ";C:\Program Files\Tailscale;C:\Program Files\Sunshine"
        tailscale up --authkey="${{ secrets.TAILSCALE_AUTH_KEY }}" --unattended --accept-routes
        
        Start-Sleep -Seconds 3
        $tailscaleIp = tailscale ip -4

        $tsAlias = (Get-NetIPAddress -IPAddress $tailscaleIp).InterfaceAlias
        netsh advfirewall firewall delete rule name="Sunshine-Web-Tailscale" 2>$null
        netsh advfirewall firewall delete rule name="Sunshine-Moonlight-TCP-Tailscale" 2>$null
        netsh advfirewall firewall delete rule name="Sunshine-Moonlight-UDP-Tailscale" 2>$null
        netsh advfirewall firewall add rule name="Sunshine-Web-Tailscale" dir=in action=allow protocol=TCP localport=47989,47990 interface="$tsAlias"
        netsh advfirewall firewall add rule name="Sunshine-Moonlight-TCP-Tailscale" dir=in action=allow protocol=TCP localport=47984-48010 interface="$tsAlias"
        netsh advfirewall firewall add rule name="Sunshine-Moonlight-UDP-Tailscale" dir=in action=allow protocol=UDP localport=47998-48010 interface="$tsAlias"

        $configDirs = @(
            "$env:USERPROFILE\.config\sunshine",
            "C:\Users\runneradmin\.config\sunshine",
            "C:\Users\RdpUser\.config\sunshine",
            "C:\Windows\System32\config\systemprofile\.config\sunshine",
            "C:\Program Files\Sunshine\config"
        )

        $confContent = @"
        csrf_allowed_origins = *
        origin_pin_allowed = 1
        "@

        foreach ($dir in $configDirs) {
            New-Item -ItemType Directory -Force -Path $dir 2>$null
            Set-Content -Path "$dir\sunshine.conf" -Value $confContent -Force
        }

        & "C:\Program Files\Sunshine\sunshine.exe" --creds RdpUser "$password"

        if (Get-Service -Name "sunshine" -ErrorAction SilentlyContinue) {
            Restart-Service -Name "sunshine"
            $sunshineMode = "Windows Service"
        } else {
            Start-Process -FilePath "C:\Program Files\Sunshine\sunshine.exe" -WindowStyle Hidden
            $sunshineMode = "Processo Direto"
        }

        Start-Sleep -Seconds 5

        $serviceActive = $false
        if ((Get-Process -Name "sunshine" -ErrorAction SilentlyContinue) -or ((Get-Service -Name "sunshine" -ErrorAction SilentlyContinue).Status -eq "Running")) {
            $serviceActive = $true
        }

        $displays = Get-CimInstance Win32_DesktopMonitor
        $displayCount = ($displays | Measure-Object).Count
        $gpus = Get-CimInstance Win32_VideoController | Select-Object -ExpandProperty Name
        $portCheck = Test-NetConnection -ComputerName 127.0.0.1 -Port 47990 -InformationLevel Quiet

        Write-Host "==========================================" -ForegroundColor Cyan
        Write-Host "DIAGNOSTICO DO SUNSHINE E DISPLAY" -ForegroundColor Cyan
        Write-Host "Modo de Execucao       : $sunshineMode"
        Write-Host "Servico/Processo Ativo : $serviceActive"
        Write-Host "Porta Web 47990 Local  : $portCheck"
        Write-Host "Monitores Detectados   : $displayCount"
        Write-Host "Adaptadores de Video   : $($gpus -join ', ')"
        Write-Host "==========================================" -ForegroundColor Cyan

        Write-Host "==========================================" -ForegroundColor Green
        Write-Host "DADOS DE CONEXAO" -ForegroundColor Green
        Write-Host "IP TAILSCALE   : $tailscaleIp" -ForegroundColor Yellow
        Write-Host "USUARIO        : RdpUser" -ForegroundColor Yellow
        Write-Host "SENHA          : $password" -ForegroundColor Yellow
        Write-Host "------------------------------------------" -ForegroundColor Cyan
        Write-Host "WEB SUNSHINE   : https://$($tailscaleIp):47990" -ForegroundColor Cyan
        Write-Host "LOGIN WEB      : RdpUser" -ForegroundColor Cyan
        Write-Host "SENHA WEB      : $password" -ForegroundColor Cyan
        Write-Host "==========================================" -ForegroundColor Green

        while ($true) {
            Start-Sleep -Seconds 60
        }
